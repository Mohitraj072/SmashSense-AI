<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - SmashSense.AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandBg: '#0A0F1E',
            brandCard: '#111827',
            brandBorder: '#1F2937',
            brandAccent: '#00C853',
            brandWarning: '#FF6B35',
            brandInfo: '#3B82F6',
            brandTextPrimary: '#F9FAFB',
            brandTextSecondary: '#9CA3AF',
            brandSuccess: '#10B981',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#0A0F1E] text-[#F9FAFB] font-sans antialiased min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md space-y-6">

    <!-- Brand Logo & Header -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-500 to-cyan-400 text-slate-950 font-black text-2xl shadow-xl shadow-emerald-500/20 mb-2">
        🏸
      </div>
      <h1 class="text-2xl font-black text-white tracking-tight">SmashSense.AI</h1>
      <p class="text-xs text-slate-400">Badminton AI Match Analysis & Performance Hub</p>
    </div>

    <!-- Login Card -->
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-5">
      <div class="border-b border-slate-800 pb-3">
        <h2 class="text-lg font-extrabold text-white">Welcome Back</h2>
        <p class="text-xs text-slate-400">Sign in to access your match analytics and AI reports</p>
      </div>

      <!-- Alert Error Message -->
      <div id="error-message" class="hidden p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs font-medium leading-relaxed">
        Invalid email or password. Please try again.
      </div>

      <!-- Login Form -->
      <form id="login-form" class="space-y-4">
        <div>
          <label for="email" class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Email Address</label>
          <input
            type="email"
            id="email"
            required
            placeholder="player@badminton.com"
            class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white text-xs placeholder:text-slate-600 focus:outline-none focus:border-emerald-500 transition-all"
          />
        </div>

        <div>
          <label for="password" class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Password</label>
          <input
            type="password"
            id="password"
            required
            placeholder="••••••••"
            class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white text-xs placeholder:text-slate-600 focus:outline-none focus:border-emerald-500 transition-all"
          />
        </div>

        <button
          type="submit"
          id="submit-btn"
          class="w-full py-3.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-xs tracking-wide shadow-lg shadow-emerald-500/20 transition-all flex items-center justify-center gap-2"
        >
          <span>Sign In to Dashboard</span>
          <span id="spinner" class="hidden animate-spin">⏳</span>
        </button>
      </form>

      <!-- Footer Link to Signup -->
      <div class="pt-2 text-center text-xs text-slate-400 border-t border-slate-800/80">
        Don't have an account yet? 
        <a href="/signup.html" class="text-emerald-400 font-bold hover:underline ml-1">Create Account</a>
      </div>
    </div>

    <!-- Quick Navigation Links -->
    <div class="flex items-center justify-center gap-4 text-xs text-slate-500">
      <a href="/" class="hover:text-slate-300 transition-colors">← Main App</a>
      <span>•</span>
      <a href="/dashboard.html" class="hover:text-slate-300 transition-colors">Dashboard Page</a>
      <span>•</span>
      <a href="/history.html" class="hover:text-slate-300 transition-colors">Match History</a>
    </div>

  </div>

  <!-- Firebase JS SDK v9 Modular -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

    // Firebase Configuration (Replace values with your Firebase Project Config)
    const firebaseConfig = {
      apiKey: "AIzaSy_YOUR_FIREBASE_API_KEY",
      authDomain: "smashsense-badminton.firebaseapp.com",
      projectId: "smashsense-badminton",
      storageBucket: "smashsense-badminton.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abcdef123456"
    };

    // Check if configuration has valid API key
    const isRealFirebaseConfig = firebaseConfig.apiKey && !firebaseConfig.apiKey.includes('YOUR_FIREBASE_API_KEY');

    // Initialize Firebase if configured
    let app, auth;
    if (isRealFirebaseConfig) {
      try {
        app = initializeApp(firebaseConfig);
        auth = getAuth(app);
      } catch (e) {
        console.warn("Firebase initialized in fallback mode:", e);
      }
    }

    const loginForm = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const errorMsg = document.getElementById('error-message');
    const submitBtn = document.getElementById('submit-btn');
    const spinner = document.getElementById('spinner');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.add('hidden');
      
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      if (!email || !password) {
        showError('Please enter both email and password.');
        return;
      }

      submitBtn.disabled = true;
      spinner.classList.remove('hidden');

      try {
        if (auth && isRealFirebaseConfig) {
          const userCredential = await signInWithEmailAndPassword(auth, email, password);
          console.log("Logged in user:", userCredential.user);
        }
        
        // Store session marker
        localStorage.setItem('user_session', JSON.stringify({ email, loggedIn: true }));
        
        // Redirect to dashboard on success
        window.location.href = '/dashboard.html';
      } catch (error) {
        // If API key is invalid or unconfigured, fallback seamlessly to demo session
        if (!isRealFirebaseConfig || error.code === 'auth/api-key-not-valid' || error.code === 'auth/invalid-api-key' || (error.message && error.message.includes('api-key-not-valid'))) {
          localStorage.setItem('user_session', JSON.stringify({ email, loggedIn: true }));
          window.location.href = '/dashboard.html';
          return;
        }

        console.error("Login Error:", error);
        let msg = "Failed to sign in. Please check your credentials.";
        if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
          msg = "Incorrect email address or password.";
        } else if (error.code === 'auth/invalid-email') {
          msg = "Please provide a valid email address.";
        } else if (error.code === 'auth/too-many-requests') {
          msg = "Too many failed attempts. Please try again later.";
        }

        showError(msg);
      } finally {
        submitBtn.disabled = false;
        spinner.classList.add('hidden');
      }
    });

    function showError(message) {
      errorMsg.textContent = message;
      errorMsg.classList.remove('hidden');
    }
  </script>
</body>
</html>
