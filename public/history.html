<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Match History - Badminton Video Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandBg: '#0A0F1E',
            brandCard: '#111827',
            brandBorder: '#1F2937',
            brandAccent: '#00C853',
            brandWarning: '#FF6B35',
            brandInfo: '#3B82F6',
            brandTextPrimary: '#F9FAFB',
            brandTextSecondary: '#9CA3AF',
            brandSuccess: '#10B981',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    @keyframes fadeInCard {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-card {
      animation: fadeInCard 0.35s ease-out forwards;
    }
  </style>
</head>
<body class="bg-[#0A0F1E] text-[#F9FAFB] font-sans antialiased min-h-screen">

  <div id="navbar-container"></div>
  <script src="/navbar.js"></script>

  <div class="max-w-6xl mx-auto space-y-6 p-4 sm:p-6 lg:p-8">

    <!-- Header Section -->
    <header class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pb-6 border-b border-[#1F2937]">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-xl bg-[#00C853]/10 border border-[#00C853]/30 flex items-center justify-center text-[#00C853] font-bold text-2xl">
          🏸
        </div>
        <div class="flex items-center gap-3">
          <h1 class="text-2xl sm:text-3xl font-bold text-[#F9FAFB] tracking-tight">Match History</h1>
          <span id="match-badge" class="px-3 py-1 rounded-full bg-[#00C853]/10 border border-[#00C853]/30 text-[#00C853] text-xs font-bold font-mono">
            0 Matches
          </span>
        </div>
      </div>

      <a href="/upload_match.html" class="px-4 py-2.5 rounded-xl bg-[#00C853] hover:bg-[#00C853]/90 text-[#0A0F1E] font-bold text-xs shadow-lg shadow-[#00C853]/20 transition-all flex items-center gap-2 text-center">
        <span>🚀 Upload Match</span>
      </a>
    </header>

    <!-- Search & Filter Controls -->
    <div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4 bg-[#111827] p-4 rounded-2xl border border-[#1F2937]">
      
      <!-- Filter Buttons Row -->
      <div class="flex items-center gap-2 overflow-x-auto pb-1 md:pb-0" id="filter-buttons">
        <button data-filter="All" class="filter-btn active-filter px-3.5 py-2 rounded-xl text-xs font-bold transition-all bg-[#00C853] text-[#0A0F1E] shadow-md shadow-[#00C853]/20 cursor-pointer shrink-0">
          All
        </button>
        <button data-sport="Badminton" class="sport-filter-btn px-3 py-2 rounded-xl text-xs font-bold transition-all bg-[#0A0F1E] text-[#9CA3AF] hover:text-[#F9FAFB] border border-[#1F2937] hover:border-[#374151] cursor-pointer shrink-0">
          🏸 Badminton
        </button>
        <button data-sport="Tennis" class="sport-filter-btn px-3 py-2 rounded-xl text-xs font-bold transition-all bg-[#0A0F1E] text-[#9CA3AF] hover:text-[#F9FAFB] border border-[#1F2937] hover:border-[#374151] cursor-pointer shrink-0">
          🎾 Tennis
        </button>
        <button data-sport="Squash" class="sport-filter-btn px-3 py-2 rounded-xl text-xs font-bold transition-all bg-[#0A0F1E] text-[#9CA3AF] hover:text-[#F9FAFB] border border-[#1F2937] hover:border-[#374151] cursor-pointer shrink-0">
          💥 Squash
        </button>
        <button data-sport="Table Tennis" class="sport-filter-btn px-3 py-2 rounded-xl text-xs font-bold transition-all bg-[#0A0F1E] text-[#9CA3AF] hover:text-[#F9FAFB] border border-[#1F2937] hover:border-[#374151] cursor-pointer shrink-0">
          🏓 Table Tennis
        </button>
        <button data-sport="Pickleball" class="sport-filter-btn px-3 py-2 rounded-xl text-xs font-bold transition-all bg-[#0A0F1E] text-[#9CA3AF] hover:text-[#F9FAFB] border border-[#1F2937] hover:border-[#374151] cursor-pointer shrink-0">
          🥒 Pickleball
        </button>
        <button data-filter="Wins" class="filter-btn px-3 py-2 rounded-xl text-xs font-bold transition-all bg-[#0A0F1E] text-[#9CA3AF] hover:text-[#F9FAFB] border border-[#1F2937] hover:border-[#374151] cursor-pointer shrink-0">
          Wins
        </button>
        <button data-filter="Losses" class="filter-btn px-3 py-2 rounded-xl text-xs font-bold transition-all bg-[#0A0F1E] text-[#9CA3AF] hover:text-[#F9FAFB] border border-[#1F2937] hover:border-[#374151] cursor-pointer shrink-0">
          Losses
        </button>
      </div>

      <!-- Search Bar -->
      <div class="relative w-full md:w-80">
        <input
          type="text"
          id="search-input"
          placeholder="Search by opponent name..."
          class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-[#0A0F1E] border border-[#1F2937] text-[#F9FAFB] text-xs placeholder-[#9CA3AF]/60 focus:outline-none focus:border-[#00C853] transition-colors"
        />
        <svg class="w-4 h-4 text-[#9CA3AF] absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>

    </div>

    <!-- Match Cards List Container -->
    <div id="match-cards-container" class="space-y-4">
      <!-- Cards rendered dynamically -->
      <div class="py-12 text-center text-[#9CA3AF] animate-pulse">
        Loading match records...
      </div>
    </div>

  </div>

  <script>
    let allMatches = [];
    let activeFilter = 'All';
    let activeSportFilter = 'All';
    let searchTerm = '';
    let expandedMatchId = null;

    function getSportIcon(sport) {
      if (sport === 'Tennis') return '🎾';
      if (sport === 'Squash') return '💥';
      if (sport === 'Table Tennis') return '🏓';
      if (sport === 'Pickleball') return '🥒';
      return '🏸';
    }

    async function fetchMatches() {
      try {
        let response = await fetch('/matches');
        if (!response.ok) {
          response = await fetch('/api/matches');
        }
        
        if (!response.ok) {
          throw new Error('Failed to fetch matches');
        }

        allMatches = await response.json();
        applyFiltersAndRender();
      } catch (error) {
        console.error('Error fetching matches:', error);
        document.getElementById('match-cards-container').innerHTML = `
          <div class="bg-[#111827] border border-[#FF6B35]/40 rounded-2xl p-8 text-center text-[#FF6B35]">
            Failed to load match records. Please refresh the page.
          </div>
        `;
      }
    }

    function applyFiltersAndRender() {
      const container = document.getElementById('match-cards-container');
      const badge = document.getElementById('match-badge');

      let filtered = allMatches.filter((m) => {
        const opponent = (m.opponentName || m.opponent_name || '').toLowerCase();
        const matchesSearch = opponent.includes(searchTerm.toLowerCase().trim());

        const matchSport = m.sport || 'Badminton';
        const matchesSport = activeSportFilter === 'All' || matchSport.toLowerCase() === activeSportFilter.toLowerCase();

        const isWin = m.result === 'Win' || m.result === 'WIN';
        const isLoss = m.result === 'Loss' || m.result === 'LOSS';

        let matchesFilter = true;
        if (activeFilter === 'Wins') {
          matchesFilter = isWin;
        } else if (activeFilter === 'Losses') {
          matchesFilter = isLoss;
        } else if (activeFilter === 'This Month') {
          const dateStr = m.date || m.match_date || '2026-08-08';
          const matchDate = new Date(dateStr);
          const now = new Date();
          matchesFilter =
            matchDate.getMonth() === now.getMonth() &&
            matchDate.getFullYear() === now.getFullYear();
        }

        return matchesSearch && matchesFilter && matchesSport;
      });

      badge.textContent = `${filtered.length} ${filtered.length === 1 ? 'Match' : 'Matches'}`;

      if (!filtered || filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-[#111827] border border-[#1F2937] rounded-2xl p-12 text-center space-y-4 flex flex-col items-center justify-center my-6">
            <div class="w-20 h-20 rounded-2xl bg-[#00C853]/10 border border-[#00C853]/20 flex items-center justify-center text-4xl text-[#00C853]">
              ⚡
            </div>
            <div class="space-y-1.5 max-w-md">
              <h3 class="text-xl font-bold text-[#F9FAFB]">No matches found</h3>
              <p class="text-sm text-[#9CA3AF] leading-relaxed">
                No match records match your selected sport or filters.
              </p>
            </div>
            <a
              href="/upload_match.html"
              class="px-6 py-3 rounded-xl bg-[#00C853] hover:bg-[#00C853]/90 text-[#0A0F1E] font-bold text-sm shadow-lg shadow-[#00C853]/20 transition-all inline-flex items-center gap-2 cursor-pointer mt-2"
            >
              <span>🚀</span>
              <span>Upload New Match</span>
            </a>
          </div>
        `;
        return;
      }

      container.innerHTML = '';

      filtered.forEach((match, idx) => {
        const isWin = match.result === 'Win' || match.result === 'WIN';
        const opponent = match.opponentName || match.opponent_name || 'Opponent Player';
        const date = match.date || match.match_date || '2026-08-08';
        const score = match.score || match.points || '21-18, 19-21, 21-15';
        const rating = match.overall_rating?.score || (isWin ? 8.5 : 6.8);
        const matchId = match.id || `m_${idx}`;
        const sport = match.sport || 'Badminton';
        const icon = getSportIcon(sport);
        const isExpanded = expandedMatchId === matchId;

        // Extracts 3 bullet points
        const vulnerability = match.player_weaknesses?.[0] || (match.weaknesses?.[0]?.description) || 'Late shoulder turn & footwork recovery in deep backhand corner.';
        const tactical = match.opponent_strategy || match.aiSummary || 'Pin opponent to deep corner to force weak returns.';
        const coachRec = match.improvement_areas?.[0] || (match.improvementAreas?.[0]?.drillName ? `${match.improvementAreas[0].drillName}: ${match.improvementAreas[0].drillDescription}` : 'Execute daily shadow footwork drills.');

        const card = document.createElement('div');
        card.style.animationDelay = `${idx * 0.05}s`;
        card.className = `animate-card bg-[#111827] border border-[#1F2937] rounded-2xl overflow-hidden shadow-xl transition-all duration-200 hover:-translate-y-1 hover:border-[#374151] ${
          isWin ? 'border-l-4 border-l-[#00C853]' : 'border-l-4 border-l-[#FF6B35]'
        }`;

        card.innerHTML = `
          <div class="p-5 sm:p-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            
            <div class="flex items-center gap-4 flex-1 min-w-0">
              <div class="w-12 h-12 rounded-xl flex items-center justify-center font-black text-xl shrink-0 shadow-sm ${
                isWin 
                  ? 'bg-[#00C853]/15 text-[#00C853] border border-[#00C853]/30' 
                  : 'bg-[#FF6B35]/15 text-[#FF6B35] border border-[#FF6B35]/30'
              }">
                ${isWin ? 'W' : 'L'}
              </div>

              <div class="space-y-1 min-w-0 flex-1">
                <div class="flex items-center gap-2 flex-wrap">
                  <h3 class="text-[18px] font-bold text-[#F9FAFB] leading-tight truncate">
                    ${opponent}
                  </h3>
                  <span class="text-[10px] px-2 py-0.5 rounded-md bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 font-extrabold flex items-center gap-1">
                    <span>${icon}</span> <span>${sport}</span>
                  </span>
                  <span class="text-[10px] px-2 py-0.5 rounded-md bg-[#0A0F1E] border border-[#1F2937] text-[#9CA3AF] font-medium">
                    ${match.category || "Men's Singles"}
                  </span>
                </div>

                <div class="flex items-center gap-3 text-[12px] text-[#9CA3AF]">
                  <span>📅 ${date}</span>
                  <span>•</span>
                  <span>⏱️ ${match.durationMinutes || 45} mins</span>
                </div>

                <div class="text-sm font-bold font-mono text-[#F9FAFB] pt-0.5">
                  ${score}
                </div>
              </div>
            </div>

            <div class="flex items-center gap-3 self-end sm:self-center shrink-0">
              <div class="w-11 h-11 rounded-full bg-[#00C853]/10 border border-[#00C853]/30 flex flex-col items-center justify-center shrink-0 shadow-sm">
                <span class="text-xs font-black text-[#00C853] leading-none">${rating}</span>
                <span class="text-[7px] font-bold text-[#9CA3AF] uppercase tracking-tighter mt-0.5">RATING</span>
              </div>

              <button
                class="toggle-btn bg-[#00C853] hover:bg-[#00C853]/90 text-[#0A0F1E] font-bold text-xs px-4 py-2.5 rounded-xl transition-all shadow-md shadow-[#00C853]/10 flex items-center gap-2 cursor-pointer"
              >
                <span>${isExpanded ? 'Hide Analysis' : 'View Analysis'}</span>
                <span class="transform transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}">▼</span>
              </button>
            </div>

          </div>

          ${
            isExpanded ? `
              <div class="px-5 pb-5 sm:px-6 sm:pb-6 pt-2 border-t border-[#1F2937] space-y-3 bg-[#0A0F1E]/60 transition-all duration-300">
                <div class="p-4 rounded-xl bg-[#0A0F1E] border border-[#1F2937] space-y-3">
                  <div class="flex items-center justify-between pb-2 border-b border-[#1F2937]">
                    <h4 class="text-xs font-bold text-[#00C853] uppercase tracking-wider flex items-center gap-2">
                      ✨ AI Key Analysis Insights
                    </h4>
                    <span class="text-[11px] text-[#9CA3AF]">Biomechanical & Tactical Breakdown</span>
                  </div>

                  <ul class="space-y-2.5 text-xs">
                    <li class="flex items-start gap-2.5">
                      <span class="w-2 h-2 rounded-full bg-[#FF6B35] mt-1 shrink-0"></span>
                      <div>
                        <strong class="text-[#FF6B35]">Key Vulnerability:</strong>
                        <span class="text-[#F9FAFB]">${vulnerability}</span>
                      </div>
                    </li>

                    <li class="flex items-start gap-2.5">
                      <span class="w-2 h-2 rounded-full bg-[#3B82F6] mt-1 shrink-0"></span>
                      <div>
                        <strong class="text-[#3B82F6]">Tactical Insight:</strong>
                        <span class="text-[#F9FAFB]">${tactical}</span>
                      </div>
                    </li>

                    <li class="flex items-start gap-2.5">
                      <span class="w-2 h-2 rounded-full bg-[#00C853] mt-1 shrink-0"></span>
                      <div>
                        <strong class="text-[#00C853]">Coach Recommendation:</strong>
                        <span class="text-[#F9FAFB]">${coachRec}</span>
                      </div>
                    </li>
                  </ul>

                  <div class="pt-3 border-t border-[#1F2937] flex justify-end">
                    <button class="full-report-btn px-3.5 py-1.5 rounded-lg bg-[#00C853]/10 hover:bg-[#00C853]/20 text-[#00C853] border border-[#00C853]/30 text-xs font-bold transition-all cursor-pointer">
                      View Full Report →
                    </button>
                  </div>
                </div>
              </div>
            ` : ''
          }
        `;

        // Add event listeners
        const toggleBtn = card.querySelector('.toggle-btn');
        if (toggleBtn) {
          toggleBtn.addEventListener('click', () => {
            expandedMatchId = isExpanded ? null : matchId;
            applyFiltersAndRender();
          });
        }

        const reportBtn = card.querySelector('.full-report-btn');
        if (reportBtn) {
          reportBtn.addEventListener('click', () => {
            const analysisPayload = {
              player_weaknesses: match.player_weaknesses || (match.weaknesses ? match.weaknesses.map(w => w.description) : []),
              improvement_areas: match.improvement_areas || (match.improvementAreas ? match.improvementAreas.map(a => a.drillDescription) : []),
              physical_recommendations: match.physical_recommendations || 'Focus on lateral movement and core stability.',
              recommended_exercises: match.recommended_exercises || [
                { exercise: 'Single-Leg Bounds', sets: '4', reps: '12 per side' },
                { exercise: 'Rotational Throws', sets: '3', reps: '15 per side' }
              ],
              opponent_weaknesses: match.opponent_weaknesses || ['Shallow lifts under pressure'],
              opponent_strategy: match.opponent_strategy || 'Pin to deep forehand corner and force weak net returns.',
              overall_rating: match.overall_rating || { score: isWin ? 8 : 6, reasoning: match.aiSummary || 'Analyzed match.' }
            };

            try {
              localStorage.setItem('latest_match_analysis', JSON.stringify(analysisPayload));
            } catch (e) {
              console.warn('Could not store analysis payload', e);
            }

            window.location.href = '/results.html';
          });
        }

        container.appendChild(card);
      });
    }

    // Filter button listeners
    document.querySelectorAll('.filter-btn').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.filter-btn, .sport-filter-btn').forEach((b) => {
          b.className = b.className.replace('bg-[#00C853] text-[#0A0F1E]', 'bg-[#0A0F1E] text-[#9CA3AF]');
          b.classList.remove('active-filter', 'shadow-md', 'shadow-[#00C853]/20');
        });

        e.target.className = 'filter-btn active-filter px-3.5 py-2 rounded-xl text-xs font-bold transition-all bg-[#00C853] text-[#0A0F1E] shadow-md shadow-[#00C853]/20 cursor-pointer shrink-0';
        activeFilter = e.target.getAttribute('data-filter') || 'All';
        activeSportFilter = 'All';
        applyFiltersAndRender();
      });
    });

    document.querySelectorAll('.sport-filter-btn').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        const targetBtn = e.target.closest('.sport-filter-btn');
        document.querySelectorAll('.filter-btn, .sport-filter-btn').forEach((b) => {
          b.className = b.className.replace('bg-[#00C853] text-[#0A0F1E]', 'bg-[#0A0F1E] text-[#9CA3AF]');
          b.classList.remove('active-filter', 'shadow-md', 'shadow-[#00C853]/20');
        });

        targetBtn.className = 'sport-filter-btn active-filter px-3 py-2 rounded-xl text-xs font-bold transition-all bg-[#00C853] text-[#0A0F1E] shadow-md shadow-[#00C853]/20 cursor-pointer shrink-0';
        activeSportFilter = targetBtn.getAttribute('data-sport');
        applyFiltersAndRender();
      });
    });

    // Search input listener
    document.getElementById('search-input').addEventListener('input', (e) => {
      searchTerm = e.target.value;
      applyFiltersAndRender();
    });

    document.addEventListener('DOMContentLoaded', fetchMatches);
  </script>
</body>
</html>
